name: CI

on:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: false
  pull_request:
    branches: [main, miriam]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Public npm packages only — no registry-url / NODE_AUTH_TOKEN (avoids E401).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          rm -f server/.npmrc server/.npmrc.bak client/.npmrc
          export DATABASE_URL="${DATABASE_URL:-postgresql://prisma:prisma@127.0.0.1:5432/prisma}"
          npm ci --ignore-scripts --registry=https://registry.npmjs.org/
          npm run build -w @maple/shared
          npm exec -w server -- prisma generate

      - name: Validate Prisma schema & migration history
        working-directory: server
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma
        run: |
          npx prisma validate
          test -f prisma/migrations/migration_lock.toml
          test -d prisma/migrations/20260725215013_init
          test -f prisma/migrations/20260725215013_init/migration.sql

      - name: Lint client
        run: npm run lint -w client

      - name: Typecheck client
        run: npm run typecheck -w client

      - name: Unit tests (client)
        run: npm run test -w client

      - name: Unit tests (server)
        run: npm run test -w server -- --ci --forceExit

      - name: Contract unit tests (node)
        run: npm run test:unit -w server

      - name: Security tests
        run: npm run test:security -w server

      - name: Build client
        run: npm run build -w client

      - name: Build server
        run: npm run build -w server
