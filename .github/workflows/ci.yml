name: CI

on:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: false
  pull_request:
    branches: [main, miriam]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Public npm packages only — no registry-url / NODE_AUTH_TOKEN (avoids E401).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Install server dependencies
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          rm -f .npmrc .npmrc.bak
          export DATABASE_URL="${DATABASE_URL:-postgresql://prisma:prisma@127.0.0.1:5432/prisma}"
          npm ci --ignore-scripts --registry=https://registry.npmjs.org/
          npx prisma generate

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Typecheck client
        working-directory: client
        run: npm run typecheck

      - name: Unit tests (server)
        working-directory: server
        run: npm test -- --ci --forceExit

      - name: Contract unit tests (node)
        working-directory: server
        run: npm run test:unit

      - name: Security tests
        working-directory: server
        run: npm run test:security

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Build server
        working-directory: server
        run: npm run build
