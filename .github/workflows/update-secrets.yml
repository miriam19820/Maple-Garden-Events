name: Update Server Secrets

on:
  workflow_dispatch:

jobs:
  update:
    name: Update secrets on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Update .env and restart server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo sed -i "s|DATABASE_URL=.*|DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}|" /app/server.env
            sudo sed -i "s|JWT_SECRET=.*|JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}|" /app/server.env
            sudo sed -i "s|EMAIL_PASS=.*|EMAIL_PASS=${{ secrets.STAGING_EMAIL_PASS }}|" /app/server.env
            docker restart maple-server
            echo "Done — server restarted with new secrets"
