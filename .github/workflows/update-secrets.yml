name: Update Server Secrets

on:
  workflow_dispatch:

jobs:
  update:
    name: Update secrets on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Update .env and restart server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Delete-then-append instead of sed s///, so a secret value
            # containing the delimiter char (e.g. "|") can't break the command.
            sudo sed -i "/^DATABASE_URL=/d" /app/server.env
            echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" | sudo tee -a /app/server.env > /dev/null
            sudo sed -i "/^JWT_SECRET=/d" /app/server.env
            echo "JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}" | sudo tee -a /app/server.env > /dev/null
            sudo sed -i "/^EMAIL_PASS=/d" /app/server.env
            echo "EMAIL_PASS=${{ secrets.STAGING_EMAIL_PASS }}" | sudo tee -a /app/server.env > /dev/null
            docker restart maple-server
            echo "Done — server restarted with new secrets"
