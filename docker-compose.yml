services:

  # ─── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: maple-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: maple
    volumes:
      - maple-db-data:/var/lib/postgresql/data
    networks:
      - maple-net
    restart: unless-stopped

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maple-redis
    volumes:
      - maple-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - maple-net
    restart: unless-stopped

  # ─── Server (Node.js API) ──────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: maple-server
    env_file: ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      PORT: "5000"
    depends_on:
      - db
      - redis
    networks:
      - maple-net
    restart: unless-stopped

  # ─── Proxy (nginx + React client) ─────────────────────────────────────────
  proxy:
    build:
      context: .
      dockerfile: routing/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_URL: ""
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE}
        VITE_TENANT_NAME: ${VITE_TENANT_NAME}
    container_name: maple-proxy
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - maple-net
    restart: unless-stopped

networks:
  maple-net:
    driver: bridge

volumes:
  maple-db-data:
  maple-redis-data:
