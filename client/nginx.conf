server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # `/` is served via the index directive inside `location /`, so a
    # `location = /index.html` rule never runs for the normal entry URL.
    # Disable caching on both entry paths so browsers cannot keep a stale
    # HTML manifest that points at old hashed JS/CSS.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
